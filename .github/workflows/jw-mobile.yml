name: JW mobile APK

# The fork's Android app, built on the newest upstream nightly. Upstream publishes a nightly only
# after its own CI passes, so that commit is the base: the commits on jw-mobile are replayed onto
# it, only the tests those commits add or change run, and the APK, signed with the fork's own key,
# goes out as a release Obtainium follows (https://github.com/zyansheep/t3code). The app installs
# beside the official one under its own id; it has no T3 cloud sign-in or push notifications,
# which need upstream's keys, and connects to servers directly.
on:
  schedule:
    - cron: "41 11 * * *"
  push:
    branches:
      - jw-mobile
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when this nightly and branch already have a release
        type: boolean
        default: false

concurrency:
  group: jw-mobile-apk
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_VARIANT: production
  EXPO_NO_GIT_STATUS: "1"
  T3CODE_ANDROID_PACKAGE: com.zyansheep.t3code
  T3CODE_APP_NAME: T3 Code JW
  T3CODE_MOBILE_UPDATES_ENABLED: "0"
  KEEP_RELEASES: "10"

jobs:
  apk:
    name: Build and release the APK
    if: github.repository == 'zyansheep/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Find the newest upstream nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          tag=$(gh release list -R pingdotgg/t3code --limit 40 --json tagName \
            -q '[.[] | select(.tagName | test("^v[0-9.]+-nightly\\.[0-9]+\\.[0-9]+$"))][0].tagName')
          [ -n "$tag" ] || { echo "::error::no upstream nightly release found"; exit 1; }
          source=$(gh api "repos/$GITHUB_REPOSITORY/commits/jw-mobile" -q .sha)
          release="$tag-jw.${source:0:7}"
          {
            echo "tag=$tag"
            echo "source=$source"
            echo "release=$release"
            echo "version=${release#v}"
            echo "code=${tag##*.}"
          } >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != true ] && gh release view "$release" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$release is out already."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout jw-mobile
        if: steps.nightly.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.nightly.outputs.source }}
          fetch-depth: 0
          filter: blob:none

      - name: Replay our commits onto the nightly
        if: steps.nightly.outputs.skip != 'true'
        env:
          TAG: ${{ steps.nightly.outputs.tag }}
        run: |
          git fetch --no-tags --filter=blob:none https://github.com/pingdotgg/t3code.git "refs/tags/$TAG:refs/tags/$TAG"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            rebase "$TAG" || {
              git status --short | head -40
              echo "::error::jw-mobile no longer applies to $TAG; rebase it by hand"
              exit 1
            }
          echo "Ours, on $TAG:"
          git log --oneline "$TAG..HEAD"

      - name: Setup Vite+
        if: steps.nightly.outputs.skip != 'true'
        uses: ./.github/actions/setup-ci-deps

      - name: Run our tests
        if: steps.nightly.outputs.skip != 'true'
        working-directory: apps/mobile
        env:
          TAG: ${{ steps.nightly.outputs.tag }}
        run: |
          mapfile -t tests < <(git diff --name-only --diff-filter=AM "$TAG" HEAD -- . \
            | grep -E '\.test\.tsx?$' | sed 's|^apps/mobile/||')
          if [ ${#tests[@]} -eq 0 ]; then echo "No tests of ours."; exit 0; fi
          vp test run --config ../../vite.config.ts "${tests[@]}"

      - name: Setup Java
        if: steps.nightly.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: steps.nightly.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Generate the Android project
        if: steps.nightly.outputs.skip != 'true'
        working-directory: apps/mobile
        env:
          T3CODE_MOBILE_VERSION: ${{ steps.nightly.outputs.version }}
          T3CODE_ANDROID_VERSION_CODE: ${{ steps.nightly.outputs.code }}
        run: vp exec expo prebuild --clean --platform android --no-install

      - name: Build the APK
        if: steps.nightly.outputs.skip != 'true'
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          T3CODE_MOBILE_VERSION: ${{ steps.nightly.outputs.version }}
          T3CODE_ANDROID_VERSION_CODE: ${{ steps.nightly.outputs.code }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Sign the APK
        if: steps.nightly.outputs.skip != 'true'
        id: apk
        env:
          KEYSTORE: ${{ secrets.JW_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.JW_ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.nightly.outputs.version }}
        run: |
          printf %s "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          KS_PASS=$(printf %s "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          export KS_PASS
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          out="$RUNNER_TEMP/t3code-jw-$VERSION.apk"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias jw --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS --out "$out" apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/release.jks"
          "$apksigner" verify --print-certs "$out" | grep -m1 'SHA-256'
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.nightly.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.nightly.outputs.tag }}
          RELEASE: ${{ steps.nightly.outputs.release }}
          SOURCE: ${{ steps.nightly.outputs.source }}
          VERSION: ${{ steps.nightly.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          gh release delete "$RELEASE" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          {
            echo "Upstream nightly [$TAG](https://github.com/pingdotgg/t3code/releases/tag/$TAG)"
            echo "with the commits on jw-mobile ($SOURCE) replayed on top:"
            echo
            git log --format='- %s' "$TAG..HEAD"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE" "$APK" -R "$GITHUB_REPOSITORY" --target "$SOURCE" \
            --title "T3 Code JW $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
          # Keep the newest few: each APK is large and only the latest is installed.
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | grep -E -- '-jw\.[0-9a-f]{7}$' | tail -n +"$((KEEP_RELEASES + 1))" \
            | while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes; done
